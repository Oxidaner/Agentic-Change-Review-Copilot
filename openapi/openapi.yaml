openapi: 3.0.3
info:
  title: Workflow Agent AI Test Platform API
  version: 0.1.0
  description: >
    MVP API contract for PR-driven API regression task creation, querying,
    retry, timeline, report export, and workflow metrics.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local
tags:
  - name: TestTasks
  - name: Metrics
paths:
  /api/v1/test-tasks:
    post:
      tags: [TestTasks]
      summary: Create a test task
      operationId: createTestTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestTaskRequest'
      responses:
        '202':
          description: Test task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTestTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/test-tasks/{task_id}:
    get:
      tags: [TestTasks]
      summary: Get test task detail
      operationId: getTestTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Test task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-tasks/{task_id}/timeline:
    get:
      tags: [TestTasks]
      summary: Get workflow timeline
      operationId: getTaskTimeline
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-tasks/{task_id}/retry:
    post:
      tags: [TestTasks]
      summary: Retry a task that needs manual attention
      operationId: retryTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryTaskRequest'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/test-tasks/{task_id}/report:
    get:
      tags: [TestTasks]
      summary: Export task report
      operationId: exportTaskReport
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        '200':
          description: Task report export
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-metrics:
    get:
      tags: [Metrics]
      summary: Query workflow metrics
      operationId: getTestMetrics
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: scenario
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workflow metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    TaskId:
      in: path
      name: task_id
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateTestTaskRequest:
      type: object
      required: [input_type, source_id, payload]
      properties:
        input_type:
          type: string
          enum: [pull_request, requirement_change]
        source_id:
          type: string
        repo:
          type: string
        service:
          type: string
        scenario:
          type: string
          default: api_regression
        dedupe_key:
          type: string
        triggered_by:
          type: string
        payload:
          $ref: '#/components/schemas/ChangeInputPayload'
    ChangeInputPayload:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        base_commit:
          type: string
        head_commit:
          type: string
        description:
          type: string
        diff_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties: true
    CreateTestTaskResponse:
      type: object
      required: [task_id, status, scenario]
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        poll_url:
          type: string
        scenario:
          type: string
    GetTestTaskResponse:
      type: object
      required: [task, assertion_result, failure_analysis, report]
      properties:
        task:
          $ref: '#/components/schemas/TestTask'
        test_points:
          type: array
          items:
            $ref: '#/components/schemas/TestPoint'
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        execution_results:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionResult'
        assertion_result:
          $ref: '#/components/schemas/AssertionResult'
        failure_analysis:
          $ref: '#/components/schemas/FailureAnalysis'
        report:
          $ref: '#/components/schemas/TestReport'
    TestTask:
      type: object
      required: [task_id, input_type, scenario, status, overall_status, created_at, updated_at]
      properties:
        task_id:
          type: string
        change_id:
          type: string
        input_type:
          type: string
        scenario:
          type: string
        repo:
          type: string
        service:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        overall_status:
          $ref: '#/components/schemas/ExecutionStatus'
        summary:
          type: string
        confidence:
          type: number
          format: float
        human_review_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskStatus:
      type: string
      enum:
        - INIT
        - PARSE_CHANGE
        - EXTRACT_TEST_POINTS
        - GENERATE_TEST_CASES
        - PREPARE_ENV
        - EXECUTE_TOOLS
        - SMART_ASSERT
        - ROOT_CAUSE_ANALYZE
        - GENERATE_REPORT
        - HUMAN_REVIEW_REQUIRED
        - DONE
        - FAILED
    ExecutionStatus:
      type: string
      enum: [PASSED, FAILED, PARTIAL, NEEDS_ATTENTION]
    TestPoint:
      type: object
      required: [point_id, name, category]
      properties:
        point_id:
          type: string
        name:
          type: string
        category:
          type: string
        rationale:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
    TestCase:
      type: object
      required: [case_id, title, tool_name]
      properties:
        case_id:
          type: string
        title:
          type: string
        tool_name:
          type: string
        preconditions:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        input_data:
          type: object
          additionalProperties: true
        expected_result:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    ExecutionArtifact:
      type: object
      required: [artifact_type]
      properties:
        artifact_type:
          type: string
        location:
          type: string
        snippet:
          type: string
    ExecutionResult:
      type: object
      required: [case_id, tool_name, status, duration_ms]
      properties:
        case_id:
          type: string
        tool_name:
          type: string
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        duration_ms:
          type: integer
        summary:
          type: string
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionArtifact'
    AssertionResult:
      type: object
      required: [status, passed_count, failed_count, false_positive]
      properties:
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        passed_count:
          type: integer
        failed_count:
          type: integer
        summary:
          type: string
        false_positive:
          type: boolean
    FailureAnalysis:
      type: object
      properties:
        failure_type:
          type: string
        probable_root_cause:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: float
        next_action:
          type: string
    TestReport:
      type: object
      required: [overall_status, total_cases, passed_cases, failed_cases]
      properties:
        overall_status:
          $ref: '#/components/schemas/ExecutionStatus'
        total_cases:
          type: integer
        passed_cases:
          type: integer
        failed_cases:
          type: integer
        summary:
          type: string
        recommended_action:
          type: string
    TimelineResponse:
      type: object
      required: [task_id, events]
      properties:
        task_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
    TimelineEvent:
      type: object
      required: [state, at]
      properties:
        state:
          $ref: '#/components/schemas/TaskStatus'
        at:
          type: string
          format: date-time
        detail:
          type: string
    RetryTaskRequest:
      type: object
      properties:
        reason:
          type: string
    RetryTaskResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
    MetricsResponse:
      type: object
      required: [window, metrics]
      properties:
        window:
          $ref: '#/components/schemas/MetricsWindow'
        scenario:
          type: string
        metrics:
          $ref: '#/components/schemas/Metrics'
    MetricsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    Metrics:
      type: object
      required:
        - task_count
        - executable_case_rate
        - workflow_success_rate
        - assertion_false_positive_rate
        - average_duration_ms
        - average_token_cost
        - manual_intervention_rate
      properties:
        task_count:
          type: integer
        executable_case_rate:
          type: number
          format: float
        workflow_success_rate:
          type: number
          format: float
        assertion_false_positive_rate:
          type: number
          format: float
        average_duration_ms:
          type: integer
        average_token_cost:
          type: number
          format: float
        manual_intervention_rate:
          type: number
          format: float
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
