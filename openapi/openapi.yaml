openapi: 3.0.3
info:
  title: Workflow Agent AI Test Platform API
  version: 0.1.0
  description: >
    MVP API contract for PR-driven API regression task creation, querying,
    retry, timeline, report export, and workflow metrics.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local
tags:
  - name: TestTasks
  - name: Metrics
  - name: Webhooks
paths:
  /api/v1/test-tasks:
    post:
      tags: [TestTasks]
      summary: Create a test task
      operationId: createTestTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestTaskRequest'
      responses:
        '202':
          description: Test task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTestTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/webhooks/github/pull-request:
    post:
      tags: [Webhooks]
      summary: Ingest a GitHub pull_request webhook
      operationId: ingestGitHubPullRequestWebhook
      parameters:
        - in: header
          name: X-GitHub-Event
          required: false
          schema:
            type: string
            enum: [pull_request]
        - in: header
          name: X-Hub-Signature-256
          required: false
          description: Required when the server is configured with GITHUB_WEBHOOK_SECRET.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubPullRequestWebhookRequest'
      responses:
        '202':
          description: Webhook accepted or intentionally ignored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/test-tasks/{task_id}:
    get:
      tags: [TestTasks]
      summary: Get test task detail
      operationId: getTestTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Test task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-tasks/{task_id}/timeline:
    get:
      tags: [TestTasks]
      summary: Get workflow timeline
      operationId: getTaskTimeline
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-tasks/{task_id}/retry:
    post:
      tags: [TestTasks]
      summary: Retry a task that needs manual attention
      operationId: retryTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryTaskRequest'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/test-tasks/{task_id}/report:
    get:
      tags: [TestTasks]
      summary: Export task report
      operationId: exportTaskReport
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        '200':
          description: Task report export
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/test-metrics:
    get:
      tags: [Metrics]
      summary: Query workflow metrics
      operationId: getTestMetrics
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: scenario
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workflow metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    TaskId:
      in: path
      name: task_id
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateTestTaskRequest:
      type: object
      required: [input_type, source_id, payload]
      properties:
        input_type:
          type: string
          enum: [pull_request, requirement_change]
        source_id:
          type: string
        repo:
          type: string
        service:
          type: string
        scenario:
          type: string
          default: api_regression
        dedupe_key:
          type: string
        triggered_by:
          type: string
        payload:
          $ref: '#/components/schemas/ChangeInputPayload'
    ChangeInputPayload:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        base_commit:
          type: string
        head_commit:
          type: string
        description:
          type: string
        diff_url:
          type: string
          format: uri
        metadata:
          type: object
          description: >
            Optional runner metadata. The live HTTP probe path supports api_base_url,
            variables, default_headers, default_cookies, and requests[] entries with headers,
            cookies, query, body, timeout_ms, max_duration_ms, max_attempts, expect_status,
            expect_headers, expect_headers_absent, expect_cookies,
            expect_cookies_absent, expect_body_contains, expect_body_not_contains,
            expect_json_present, expect_json_absent, expect_json,
            expect_json_types, extract, extract_headers, and extract_cookies fields.
          additionalProperties: true
          example:
            api_base_url: http://localhost:8080
            variables:
              username: alice
            default_cookies:
              locale: en-US
            requests:
              - name: login
                method: POST
                path: /login
                headers:
                  Content-Type: application/json
                cookies:
                  flow: login
                body:
                  user: '{{username}}'
                timeout_ms: 2000
                max_duration_ms: 250
                max_attempts: 2
                expect_status: 200
                expect_headers:
                  Content-Type: application/json
                expect_json_present: [token]
                expect_json:
                  token: abc123
                expect_json_types:
                  token: string
                extract:
                  auth_token: token
                extract_headers:
                  request_id: X-Request-Id
                expect_cookies:
                  session_id: abc123
                extract_cookies:
                  session_cookie: session_id
              - name: profile
                method: GET
                path: /profile
                timeout_ms: 2000
                max_duration_ms: 250
                headers:
                  Authorization: 'Bearer {{auth_token}}'
                query:
                  trace_id: '{{request_id}}'
                expect_status: 200
                expect_headers_absent: [X-Debug-Trace]
                expect_body_contains: [admin]
                expect_body_not_contains: [stacktrace]
                expect_json_present: [user.id]
                expect_json_absent: [debug.trace]
                expect_json:
                  status: ok
                  user.role: admin
    CreateTestTaskResponse:
      type: object
      required: [task_id, status, scenario]
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        poll_url:
          type: string
        scenario:
          type: string
    WebhookIngestResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        ignored:
          type: boolean
        reason:
          type: string
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        poll_url:
          type: string
        scenario:
          type: string
    GitHubPullRequestWebhookRequest:
      type: object
      required: [action, repository, pull_request]
      properties:
        action:
          type: string
        number:
          type: integer
        repository:
          $ref: '#/components/schemas/GitHubRepository'
        pull_request:
          $ref: '#/components/schemas/GitHubPullRequestPayload'
        sender:
          $ref: '#/components/schemas/GitHubUser'
    GitHubRepository:
      type: object
      required: [full_name]
      properties:
        name:
          type: string
        full_name:
          type: string
        html_url:
          type: string
          format: uri
    GitHubPullRequestPayload:
      type: object
      required: [number, head]
      properties:
        number:
          type: integer
        title:
          type: string
        body:
          type: string
        html_url:
          type: string
          format: uri
        diff_url:
          type: string
          format: uri
        state:
          type: string
        draft:
          type: boolean
        user:
          $ref: '#/components/schemas/GitHubUser'
        head:
          $ref: '#/components/schemas/GitHubPullRequestRef'
        base:
          $ref: '#/components/schemas/GitHubPullRequestRef'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/GitHubLabel'
    GitHubUser:
      type: object
      properties:
        login:
          type: string
    GitHubPullRequestRef:
      type: object
      properties:
        ref:
          type: string
        sha:
          type: string
    GitHubLabel:
      type: object
      properties:
        name:
          type: string
    GetTestTaskResponse:
      type: object
      required: [task, workflow, execution_plan, trace_events, assertion_result, failure_analysis, report]
      properties:
        task:
          $ref: '#/components/schemas/TestTask'
        test_points:
          type: array
          items:
            $ref: '#/components/schemas/TestPoint'
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        workflow:
          $ref: '#/components/schemas/WorkflowView'
        execution_plan:
          $ref: '#/components/schemas/ExecutionPlan'
        trace_events:
          type: array
          items:
            $ref: '#/components/schemas/TraceEvent'
        execution_results:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionResult'
        assertion_result:
          $ref: '#/components/schemas/AssertionResult'
        failure_analysis:
          $ref: '#/components/schemas/FailureAnalysis'
        report:
          $ref: '#/components/schemas/TestReport'
    TestTask:
      type: object
      required: [task_id, input_type, scenario, status, overall_status, created_at, updated_at]
      properties:
        task_id:
          type: string
        change_id:
          type: string
        input_type:
          type: string
        scenario:
          type: string
        repo:
          type: string
        service:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        overall_status:
          $ref: '#/components/schemas/ExecutionStatus'
        summary:
          type: string
        confidence:
          type: number
          format: float
        human_review_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskStatus:
      type: string
      enum:
        - INIT
        - PARSE_CHANGE
        - EXTRACT_TEST_POINTS
        - GENERATE_TEST_CASES
        - PREPARE_ENV
        - EXECUTE_TOOLS
        - SMART_ASSERT
        - ROOT_CAUSE_ANALYZE
        - GENERATE_REPORT
        - HUMAN_REVIEW_REQUIRED
        - DONE
        - FAILED
    ExecutionStatus:
      type: string
      enum: [PASSED, FAILED, PARTIAL, NEEDS_ATTENTION]
    TestPoint:
      type: object
      required: [point_id, name, category]
      properties:
        point_id:
          type: string
        name:
          type: string
        category:
          type: string
        rationale:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
    TestCase:
      type: object
      required: [case_id, title, tool_name]
      properties:
        case_id:
          type: string
        title:
          type: string
        tool_name:
          type: string
        preconditions:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        input_data:
          type: object
          additionalProperties: true
        expected_result:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    ExecutionArtifact:
      type: object
      required: [artifact_type]
      properties:
        artifact_type:
          type: string
        location:
          type: string
        snippet:
          type: string
    WorkflowView:
      type: object
      required: [workflow_id, name, state]
      properties:
        workflow_id:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/TaskStatus'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepView'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowToolView'
    WorkflowStepView:
      type: object
      required: [step_id, state, title, status, at, order]
      properties:
        step_id:
          type: string
        state:
          $ref: '#/components/schemas/TaskStatus'
        title:
          type: string
        detail:
          type: string
        status:
          type: string
        at:
          type: string
          format: date-time
        order:
          type: integer
    WorkflowToolView:
      type: object
      required: [tool_name, planned_count, executed_count]
      properties:
        tool_name:
          type: string
        planned_count:
          type: integer
        executed_count:
          type: integer
        last_status:
          $ref: '#/components/schemas/ExecutionStatus'
        expected_artifacts:
          type: array
          items:
            type: string
    ExecutionPlan:
      type: object
      required: [plan_id, mode]
      properties:
        plan_id:
          type: string
        mode:
          type: string
          enum: [heuristic, live_http]
        summary:
          type: string
        expected_artifacts:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionPlanStep'
    ExecutionPlanStep:
      type: object
      required: [step_id, order, name, tool_name]
      properties:
        step_id:
          type: string
        order:
          type: integer
        name:
          type: string
        tool_name:
          type: string
        target:
          type: string
        assertions:
          type: array
          items:
            type: string
        variable_refs:
          type: array
          items:
            type: string
        expected_artifacts:
          type: array
          items:
            type: string
    TraceEvent:
      type: object
      required: [event_id, at, state, kind]
      properties:
        event_id:
          type: string
        at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/TaskStatus'
        kind:
          type: string
        message:
          type: string
        step_id:
          type: string
        case_id:
          type: string
        tool_name:
          type: string
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        artifact_types:
          type: array
          items:
            type: string
    ExecutionResult:
      type: object
      required: [case_id, tool_name, status, duration_ms]
      properties:
        case_id:
          type: string
        tool_name:
          type: string
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        duration_ms:
          type: integer
        summary:
          type: string
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionArtifact'
    AssertionResult:
      type: object
      required: [status, passed_count, failed_count, false_positive]
      properties:
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        passed_count:
          type: integer
        failed_count:
          type: integer
        summary:
          type: string
        false_positive:
          type: boolean
    FailureAnalysis:
      type: object
      properties:
        failure_type:
          type: string
        probable_root_cause:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: float
        next_action:
          type: string
    TestReport:
      type: object
      required: [overall_status, total_cases, passed_cases, failed_cases]
      properties:
        overall_status:
          $ref: '#/components/schemas/ExecutionStatus'
        total_cases:
          type: integer
        passed_cases:
          type: integer
        failed_cases:
          type: integer
        summary:
          type: string
        recommended_action:
          type: string
    TimelineResponse:
      type: object
      required: [task_id, events]
      properties:
        task_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
    TimelineEvent:
      type: object
      required: [state, at]
      properties:
        state:
          $ref: '#/components/schemas/TaskStatus'
        at:
          type: string
          format: date-time
        detail:
          type: string
    RetryTaskRequest:
      type: object
      properties:
        reason:
          type: string
    RetryTaskResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
    MetricsResponse:
      type: object
      required: [window, metrics]
      properties:
        window:
          $ref: '#/components/schemas/MetricsWindow'
        scenario:
          type: string
        metrics:
          $ref: '#/components/schemas/Metrics'
    MetricsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    Metrics:
      type: object
      required:
        - task_count
        - executable_case_rate
        - workflow_success_rate
        - assertion_false_positive_rate
        - average_duration_ms
        - average_token_cost
        - manual_intervention_rate
      properties:
        task_count:
          type: integer
        executable_case_rate:
          type: number
          format: float
        workflow_success_rate:
          type: number
          format: float
        assertion_false_positive_rate:
          type: number
          format: float
        average_duration_ms:
          type: integer
        average_token_cost:
          type: number
          format: float
        manual_intervention_rate:
          type: number
          format: float
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
