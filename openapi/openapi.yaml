openapi: 3.0.3
info:
  title: Agentic Change Review Copilot API
  version: 0.2.0
  description: >
    Review-centric MVP API contract for change-risk audit workflows. The primary
    surface accepts reviews, persists evidence and audit traces, supports human
    decisions and evaluation feedback, exposes review metrics, and ingests
    GitHub pull_request webhooks.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local
tags:
  - name: Reviews
  - name: Metrics
  - name: Webhooks
paths:
  /api/v1/reviews:
    post:
      tags: [Reviews]
      summary: Create a change review
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '202':
          description: Review accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/reviews/{review_id}:
    get:
      tags: [Reviews]
      summary: Get review detail
      operationId: getReview
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reviews/{review_id}/timeline:
    get:
      tags: [Reviews]
      summary: Get review timeline
      operationId: getReviewTimeline
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reviews/{review_id}/decision:
    post:
      tags: [Reviews]
      summary: Submit a human review decision
      operationId: submitHumanDecision
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanDecisionRequest'
      responses:
        '202':
          description: Decision accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reviews/{review_id}/retry:
    post:
      tags: [Reviews]
      summary: Retry a failed review
      operationId: retryReview
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/reviews/{review_id}/report:
    get:
      tags: [Reviews]
      summary: Export review report
      operationId: exportReview
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        '200':
          description: Review report export
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/GetReviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reviews/{review_id}/evaluation:
    post:
      tags: [Reviews]
      summary: Submit post-release evaluation feedback
      operationId: updateEvaluation
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationUpdateRequest'
      responses:
        '202':
          description: Evaluation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/review-metrics:
    get:
      tags: [Metrics]
      summary: Query evaluation metrics
      operationId: getReviewMetrics
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: service
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Review metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationMetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/webhooks/github/pull-request:
    post:
      tags: [Webhooks]
      summary: Ingest a GitHub pull_request webhook
      operationId: ingestGitHubPullRequestWebhook
      parameters:
        - in: header
          name: X-GitHub-Event
          required: false
          schema:
            type: string
            enum: [pull_request]
        - in: header
          name: X-Hub-Signature-256
          required: false
          description: Required when the server is configured with GITHUB_WEBHOOK_SECRET.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubPullRequestWebhookRequest'
      responses:
        '202':
          description: Webhook accepted or intentionally ignored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewWebhookIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    ReviewId:
      in: path
      name: review_id
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateReviewRequest:
      type: object
      required: [source_type, source_id, environment, payload]
      properties:
        source_type:
          type: string
          example: pull_request
        source_id:
          type: string
          example: octo/gateway-service#42
        repo:
          type: string
        service:
          type: string
        environment:
          type: string
          example: prod
        trigger_mode:
          type: string
        dedupe_key:
          type: string
        triggered_by:
          type: string
        payload:
          $ref: '#/components/schemas/ReviewPayload'
    ReviewPayload:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        base_commit:
          type: string
        head_commit:
          type: string
        diff_url:
          type: string
        metadata:
          type: object
          additionalProperties: true
    CreateReviewResponse:
      type: object
      required: [review_id, task_id, status, poll_url]
      properties:
        review_id:
          type: string
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
        poll_url:
          type: string
    GetReviewResponse:
      type: object
      required: [review]
      properties:
        review:
          $ref: '#/components/schemas/Review'
        analysis:
          $ref: '#/components/schemas/HybridAnalysis'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/RiskSignal'
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        rollback_plan:
          $ref: '#/components/schemas/RollbackPlan'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
    Review:
      type: object
      required: [review_id, source_type, status, created_at, updated_at]
      properties:
        review_id:
          type: string
        change_id:
          type: string
        source_type:
          type: string
        repo:
          type: string
        service:
          type: string
        environment:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        score:
          type: integer
        confidence:
          type: number
          format: double
        summary:
          type: string
        human_review_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewStatus:
      type: string
      enum:
        - CREATED
        - NORMALIZED
        - UNDERSTOOD
        - COLLECTING_CONTEXT
        - CONTEXT_READY
        - SIGNALS_EXTRACTED
        - SCORED
        - RECOMMENDED
        - WAITING_HUMAN_REVIEW
        - APPROVED
        - REJECTED
        - OVERRIDDEN
        - FAILED
        - CANCELLED
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    RiskSignal:
      type: object
      required: [signal_name, severity]
      properties:
        signal_id:
          type: string
        signal_name:
          type: string
        severity:
          $ref: '#/components/schemas/RiskLevel'
        score_delta:
          type: integer
        explanation:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
    Recommendation:
      type: object
      properties:
        required_reviewers:
          type: array
          items:
            type: string
        release_window:
          type: string
        rollout_strategy:
          $ref: '#/components/schemas/RolloutStrategy'
        observability_plan:
          type: array
          items:
            type: string
    HybridAnalysis:
      type: object
      properties:
        mode:
          type: string
        analyzer:
          type: string
        summary:
          type: string
        confidence:
          type: number
          format: double
        requires_human_review:
          type: boolean
        rationale:
          type: array
          items:
            type: string
        suggested_signals:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedRiskSignal'
    SuggestedRiskSignal:
      type: object
      required: [signal_name, severity]
      properties:
        signal_name:
          type: string
        severity:
          $ref: '#/components/schemas/RiskLevel'
        explanation:
          type: string
    RolloutStrategy:
      type: object
      properties:
        steps:
          type: array
          items:
            type: string
        interval_minutes:
          type: integer
    RollbackPlan:
      type: object
      properties:
        trigger_condition:
          type: string
        steps:
          type: array
          items:
            type: string
        version_to_restore:
          type: string
        verification_metrics:
          type: array
          items:
            type: string
        rollback_deadline_seconds:
          type: integer
    EvidenceItem:
      type: object
      required: [evidence_id, type, source]
      properties:
        evidence_id:
          type: string
        type:
          type: string
        source:
          type: string
        title:
          type: string
        content_snippet:
          type: string
        reference_url:
          type: string
        confidence:
          type: number
          format: double
        metadata:
          type: object
          additionalProperties: true
    TimelineResponse:
      type: object
      required: [review_id, events]
      properties:
        review_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
    TimelineEvent:
      type: object
      required: [state, at]
      properties:
        state:
          $ref: '#/components/schemas/ReviewStatus'
        at:
          type: string
          format: date-time
        detail:
          type: string
    HumanDecisionRequest:
      type: object
      required: [reviewer, decision]
      properties:
        reviewer:
          type: string
        decision:
          type: string
          enum: [approve, reject, override]
        reason:
          type: string
        notify:
          type: boolean
    HumanDecisionResponse:
      type: object
      required: [review_id, status, recorded]
      properties:
        review_id:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
        recorded:
          type: boolean
    RetryRequest:
      type: object
      properties:
        reason:
          type: string
    RetryResponse:
      type: object
      required: [review_id, task_id, status]
      properties:
        review_id:
          type: string
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
    EvaluationUpdateRequest:
      type: object
      properties:
        release_outcome:
          type: string
        incident_flag:
          type: boolean
        outcome_metadata:
          type: object
          additionalProperties: true
    EvaluationUpdateResponse:
      type: object
      required: [review_id, recorded]
      properties:
        review_id:
          type: string
        recorded:
          type: boolean
    EvaluationMetricsResponse:
      type: object
      required: [window, metrics]
      properties:
        window:
          $ref: '#/components/schemas/MetricsWindow'
        service:
          type: string
        metrics:
          $ref: '#/components/schemas/Metrics'
    MetricsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    Metrics:
      type: object
      properties:
        review_count:
          type: integer
        high_risk_recall:
          type: number
          format: double
        false_positive_rate:
          type: number
          format: double
        override_rate:
          type: number
          format: double
        p95_latency_ms:
          type: integer
    ReviewWebhookIngestResponse:
      type: object
      properties:
        accepted:
          type: boolean
        ignored:
          type: boolean
        reason:
          type: string
        review_id:
          type: string
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
        poll_url:
          type: string
    GitHubPullRequestWebhookRequest:
      type: object
      required: [action, repository, pull_request]
      properties:
        action:
          type: string
        number:
          type: integer
        repository:
          type: object
          properties:
            name:
              type: string
            full_name:
              type: string
            html_url:
              type: string
        pull_request:
          type: object
          properties:
            number:
              type: integer
            title:
              type: string
            body:
              type: string
            html_url:
              type: string
            diff_url:
              type: string
            state:
              type: string
            draft:
              type: boolean
            user:
              type: object
              properties:
                login:
                  type: string
            head:
              type: object
              properties:
                ref:
                  type: string
                sha:
                  type: string
            base:
              type: object
              properties:
                ref:
                  type: string
                sha:
                  type: string
            labels:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
        sender:
          type: object
          properties:
            login:
              type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
