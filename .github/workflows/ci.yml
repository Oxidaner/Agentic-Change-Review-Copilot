name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: review_copilot
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d review_copilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://review:review@localhost:5432/review_copilot?sslmode=disable
        run: go test ./internal/testflow -run Postgres -count=1

      - name: Build
        run: go build ./...
